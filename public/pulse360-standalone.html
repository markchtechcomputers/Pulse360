<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');
:root{color-scheme:light;--bg:#fff;--surface:#f5f6f9;--surface2:#e9edf4;--ink:#121a2b;--muted:#5d6779;--line:#e3e6ee;--red:#ed2447;--red2:#c91435;--navy:#101b35;--card:#fff;--shadow:0 10px 30px #101b3514;--r:12px;--head-h:64px}
html[data-theme=dark]{color-scheme:dark;--bg:#0d1420;--surface:#141d2e;--surface2:#1c273b;--ink:#eef2f9;--muted:#a4afc2;--line:#27324a;--red:#ff4d6d;--red2:#ff7b92;--navy:#070c17;--card:#131c2c;--shadow:0 10px 30px #0006}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{max-width:100%}h1,h2,h3{font-family:Manrope,'DM Sans',sans-serif;letter-spacing:-.03em;margin:0}
:focus-visible{outline:3px solid #ed244788;outline-offset:2px;border-radius:6px}
.container{width:min(1240px,calc(100% - 32px));margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
body.locked{overflow:hidden}

/* top strip */
.top-strip{background:var(--surface);border-bottom:1px solid var(--line);font-size:11px}
.strip-inner{display:flex;align-items:center;gap:12px;min-height:40px;padding-block:4px}
.live-badge{background:var(--red);color:#fff;font-weight:700;letter-spacing:.1em;font-size:9px;padding:5px 9px;border-radius:4px;white-space:nowrap}
.strip-date{color:var(--muted);font-weight:600;white-space:nowrap}
.strip-inner .social-links{margin-left:auto}
.social-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.social-link{width:30px;height:30px;display:grid;place-items:center;background:#fff;border:1px solid #e1e5ed;border-radius:8px;transition:transform .18s,border-color .18s}
.social-link:hover{transform:translateY(-2px);border-color:var(--red)}
.social-link img{width:22px;height:22px;object-fit:contain;display:block}
.social-fallback{font-weight:800;color:#101b35}
.social-link [hidden]{display:none!important}

/* header — ONE menu button at every size */
.site-header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);border-top:3px solid var(--red)}
.header-main{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"menu brand theme" "search search search";align-items:center;gap:8px 10px;padding-block:9px}
.menu-btn{grid-area:menu}.brand{grid-area:brand;justify-self:start}.theme-btn{grid-area:theme}.header-search{grid-area:search}.main-nav{grid-area:nav;display:none}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);transition:.15s}
.icon-btn:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--red);color:#fff;border-radius:8px;font-family:Manrope,sans-serif;font-weight:800;font-size:15px;letter-spacing:-.1em;box-shadow:0 5px 14px #ed24472b}
.brand-mark span{font-size:9px;margin-left:-2px}
.brand-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand-copy strong{font-family:Manrope,sans-serif;font-size:23px;font-weight:800;letter-spacing:-1.3px;line-height:1}.brand-copy strong span{color:var(--red)}
.brand-copy small{font-size:7.5px;font-weight:700;letter-spacing:1.5px;color:var(--muted);white-space:nowrap}
.theme-btn .i-sun{display:none}html[data-theme=dark] .theme-btn .i-sun{display:block}html[data-theme=dark] .theme-btn .i-moon{display:none}

.header-search{position:relative}
.header-search form{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 4px 0 14px;transition:.15s}
.header-search form:focus-within{border-color:var(--red);background:var(--bg);box-shadow:0 0 0 4px #ed244722}
.header-search input{flex:1;min-width:0;height:42px;border:0;background:transparent;outline:0;font-size:15px}
.header-search input::placeholder{color:var(--muted)}
.header-search button{width:36px;height:36px;border:0;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.header-search button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:min(70vh,440px);overflow:auto;z-index:60}
.suggest[hidden]{display:none}
.suggest a{display:block;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
.suggest a:hover,.suggest a:focus{background:var(--surface)}
.suggest small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.suggest .all{color:var(--red);font-weight:700;border:0}
.suggest .msg{padding:14px;color:var(--muted);font-size:13px}

@media(min-width:720px){.header-main{grid-template-columns:auto auto 1fr auto;grid-template-areas:"menu brand search theme";gap:12px;padding-block:12px}.brand-mark{width:44px;height:44px}.brand-copy strong{font-size:26px}.brand-copy small{font-size:8px}}
@media(min-width:1120px){.header-main{grid-template-columns:auto auto 1fr minmax(260px,360px) auto;grid-template-areas:"brand nav nav search theme";gap:16px}
.menu-btn{grid-area:unset;order:9;width:auto;padding:0 14px 0 12px;gap:8px;display:flex;align-items:center;font-size:13px;font-weight:700}
.menu-btn:after{content:"All sections"}
.header-main{grid-template-columns:auto 1fr minmax(240px,340px) auto auto;grid-template-areas:"brand nav search theme menu"}
.main-nav{display:flex;gap:4px;justify-content:center}.main-nav a{padding:9px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}.main-nav a:hover{color:var(--ink);background:var(--surface)}.main-nav a.active{color:#fff;background:var(--red)}}

/* drawer */
.scrim{position:fixed;inset:0;background:#050a16b0;z-index:90;backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}.scrim.show{opacity:1}.scrim[hidden]{display:none}
.drawer{position:fixed;z-index:100;top:0;left:0;bottom:0;width:min(420px,90vw);background:var(--bg);overflow-y:auto;transform:translateX(-102%);visibility:hidden;transition:transform .25s ease,visibility .25s;padding:18px 20px 30px;box-shadow:18px 0 55px #0004;overscroll-behavior:contain}
.drawer.open{transform:none;visibility:visible}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.drawer h3{font-size:11px;letter-spacing:.14em;color:var(--red);margin:22px 0 8px}
.drawer .d-link{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px}.drawer .d-link:hover{background:var(--surface)}
.drawer .d-link b{font-family:Manrope,sans-serif;font-size:15px}.drawer .d-link small{color:var(--muted);font-size:12px}
.chip-cloud{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;white-space:nowrap;padding:8px 14px;border:1px solid var(--line);background:transparent;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--red);color:var(--red)}.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
html[data-theme=dark] .chip.active{background:var(--red);border-color:var(--red)}

/* ticker */
.ticker{display:flex;align-items:center;background:var(--navy);color:#fff;font-size:13px;overflow:hidden;min-height:40px}
.ticker-label{background:var(--red);padding:0 14px;align-self:stretch;display:flex;align-items:center;font-weight:800;font-size:10px;letter-spacing:.12em;flex:none;z-index:1}
.ticker-view{overflow:hidden;flex:1}
.ticker-track{display:inline-flex;gap:44px;white-space:nowrap;padding-left:30px;animation:tick 90s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track a{opacity:.92}.ticker-track a:hover{opacity:1;text-decoration:underline}
.ticker-track b{color:#ff8da2;font-size:10px;letter-spacing:.08em;margin-right:8px}
@keyframes tick{to{transform:translateX(-50%)}}

/* hero swiper */
.hero{padding-top:20px}
.hero-wrap{position:relative}
.hero-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.hero-track::-webkit-scrollbar,.rail::-webkit-scrollbar,.chip-row::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/11;min-height:320px;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,hsl(var(--h,350) 70% 38%),var(--navy));color:#fff;display:flex;align-items:flex-end}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 25%,#050a16f2);z-index:1}
.slide-body{position:relative;z-index:2;padding:18px 18px 44px;max-width:900px}
.slide .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;background:var(--red);padding:5px 9px;border-radius:4px;text-transform:uppercase}
.slide h2{font-size:clamp(21px,5.4vw,40px);line-height:1.15;margin:10px 0 8px;text-wrap:balance}
.slide p{margin:0;color:#dfe5f0;font-size:14px;display:none}
.slide .meta{font-size:12px;color:#cbd3e2;margin-top:6px}
.hero-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:#fffe;color:#101b35;display:none;place-items:center;z-index:3;box-shadow:var(--shadow)}
.hero-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.hero-nav.prev{left:12px}.hero-nav.next{right:12px}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px;z-index:3}
.dots button{width:8px;height:8px;border-radius:99px;border:0;background:#fff7;padding:0;transition:.25s}.dots button.on{width:24px;background:#fff}
@media(min-width:720px){.slide{aspect-ratio:21/9;min-height:380px}.slide-body{padding:30px 34px 50px}.slide p{display:block;max-width:680px}.hero-nav{display:grid}}
@media(min-width:1000px){.slide{flex-basis:calc(100% - 0px)}}

/* sections + rails */
.section{padding:34px 0 6px}
.section.alt{background:var(--surface);margin-top:30px;padding:34px 0 38px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.15em;color:var(--red);text-transform:uppercase}
.sec-head h2{font-size:clamp(23px,4vw,32px);margin-top:4px}.sec-head h2 i{color:var(--red);font-style:normal}
.see-all{font-size:13px;font-weight:700;white-space:nowrap}.see-all:hover{color:var(--red)}
.rail-wrap{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px 2px 12px;margin-inline:-2px;-webkit-overflow-scrolling:touch}
.rail .card{flex:0 0 min(78vw,300px);scroll-snap-align:start}
.rail-btn{position:absolute;top:34%;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:none;place-items:center;z-index:2;color:var(--ink)}
.rail-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}.rail-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.rail-btn.l{left:-14px}.rail-btn.r{right:-14px}
@media(min-width:900px){.rail-btn{display:grid}}
.chip-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card-media{position:relative;display:block;aspect-ratio:16/10;background:linear-gradient(135deg,hsl(var(--h,350) 65% 42%),var(--navy));overflow:hidden}
.card-media:after{content:attr(data-ini);position:absolute;inset:0;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;font-size:54px;color:#fff3}
.card-media img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .card-media img{transform:scale(1.05)}
.card-body{padding:12px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.card-meta b{color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.05em;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h3{font-size:16.5px;line-height:1.32;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card h3 a:hover{color:var(--red)}
.card p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.skeleton{height:280px;border-radius:var(--r);background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);background-size:200% 100%;animation:sh 1.4s infinite}
.rail .skeleton{flex:0 0 min(78vw,300px)}.slide.skeleton{aspect-ratio:16/11}
@keyframes sh{to{background-position:-200% 0}}
.empty,.error{padding:28px;background:var(--surface);border-radius:var(--r);color:var(--muted);text-align:center;width:100%}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:14px}.btn:hover{border-color:var(--red);color:var(--red)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.btn.primary:hover{background:var(--red2);color:#fff}
.center{text-align:center;margin:28px 0}

/* pages */
.page{padding-block:26px 56px;min-height:60vh}
.page-head{margin-bottom:14px}.page-head h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:6px 0}.page-head p{color:var(--muted);margin:0;max-width:640px;font-size:14px}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 16px}
.status button{border:0;background:none;color:var(--red);font-weight:700;font-size:12px}
.qpill{display:inline-flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;margin-top:10px}.qpill a{color:var(--red);font-weight:800}
.info-page{padding-block:30px 60px;min-height:62vh}
.info-hero{background:var(--navy);color:#fff;padding:clamp(26px,5vw,52px);border-radius:var(--r)}
.info-hero h1{font-size:clamp(32px,6vw,56px);margin:10px 0}.info-hero p{color:#c0c9d8;margin:0;max-width:680px}.info-hero .eyebrow{color:#ff8da2}
.info-content{max-width:780px;margin:0 auto;padding:30px 4px 14px;font-size:15.5px;line-height:1.85}.info-content p,.info-content ul{color:var(--muted)}
.info-lead{font-size:19px!important;color:var(--ink)!important}.info-content h2{font-size:22px;margin:26px 0 8px}.info-content li{margin:8px 0}
.info-related{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;padding:20px 4px;border-top:1px solid var(--line)}

/* footer */
.site-footer{background:#0b1222;color:#fff;margin-top:50px}
.footer-main{display:grid;grid-template-columns:1fr;gap:30px;padding-block:44px 30px}
.site-footer .brand-copy small{color:#a3aec1}
.footer-brand p{color:#9ba8bc;font-size:14px;line-height:1.75;max-width:380px;margin:16px 0}
.site-footer .social-links{gap:8px}.site-footer .social-link{width:38px;height:38px;border-radius:10px}.site-footer .social-link img{width:26px;height:26px}
.footer-col h3{font-size:11px;letter-spacing:.14em;color:#fff;margin-bottom:12px}
.footer-col a{display:block;color:#9ba8bc;font-size:14px;padding:5px 0}.footer-col a:hover{color:#fff}
.footer-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.footer-bottom{border-top:1px solid #ffffff1f;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:18px;font-size:12px;color:#9ba8bc}
.footer-bottom a{color:#fff;font-weight:700}
.footer-note{font-size:12px;color:#8693a9;line-height:1.7;padding-bottom:22px}
@media(min-width:720px){.footer-main{grid-template-columns:1.2fr 1.6fr}.footer-cols{grid-template-columns:repeat(3,1fr)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);max-width:calc(100% - 32px);padding:13px 18px;background:var(--navy);color:#fff;border-radius:12px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.brand-copy small{display:none}.strip-date{display:none}.social-link{width:28px;height:28px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.ticker-view{overflow-x:auto}}

/* ---- story preview ---- */
.modal{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center}.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:#050a16c4;backdrop-filter:blur(3px);animation:fade .2s}
.modal-card{position:relative;background:var(--bg);width:100%;max-width:780px;max-height:93vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;outline:0;animation:rise .28s ease}
.modal-scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal-x{position:absolute;top:10px;right:10px;z-index:3;background:#000b;border-color:transparent;color:#fff}
.m-media{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,hsl(var(--h,350) 65% 42%),var(--navy))}
.m-media:after{content:attr(data-ini);position:absolute;inset:0;display:grid;place-items:center;font:800 70px Manrope,sans-serif;color:#fff3}
.m-media img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
.m-body{padding:18px 20px 30px}.m-body h2{font-size:clamp(22px,4.2vw,32px);line-height:1.18;margin:10px 0 14px;text-wrap:balance}
.m-sum{font-size:16.5px;line-height:1.75;margin:0 0 12px}.m-credit{font-size:12px;color:var(--muted)}
.m-actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.m-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:26px 0 8px}
.m-list a{display:block;padding:12px 2px;border-top:1px solid var(--line);font-weight:600;font-size:15px;line-height:1.4}.m-list a:hover{color:var(--red)}
.m-list small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media(min-width:720px){.modal{align-items:center;padding:24px}.modal-card{border-radius:18px;max-height:90vh}}

/* ---- featured top news ---- */
.top-grid{display:grid;gap:16px}
.top-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.top-list h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 #ed2447aa;animation:pulse 1.6s infinite}@keyframes pulse{70%{box-shadow:0 0 0 9px #ed244700}100%{box-shadow:0 0 0 0 #ed244700}}
.top-list ol{list-style:none;margin:0;padding:0;counter-reset:n}
.top-list li{counter-increment:n;display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.top-list li:before{content:counter(n);font:800 20px Manrope,sans-serif;color:var(--red);min-width:20px;line-height:1.2}
.top-list a{font-weight:700;font-size:14.5px;line-height:1.35;display:block}.top-list a:hover{color:var(--red)}
.top-list small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
@media(min-width:1000px){.top-grid{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);align-items:start}.top-grid .slide{aspect-ratio:16/10;min-height:0}}
.newbar{display:block;margin:0 auto 16px;position:sticky;top:100px;z-index:20;background:var(--red);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.caught{text-align:center;color:var(--muted);font-size:13px;margin:26px 0}
.top-grid{grid-template-columns:minmax(0,1fr)}.top-grid>*,.hero-wrap{min-width:0}
@media(min-width:1000px){.top-grid{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}}
@media(max-width:520px){.strip-date{display:none}.strip-inner{gap:8px}.strip-inner .social-links{flex-wrap:nowrap;gap:5px}.social-link{width:30px;height:30px}}
@media(min-width:1120px){.menu-btn{width:42px!important;padding:0!important}.menu-btn:after{content:none!important}.header-main{grid-template-columns:auto minmax(0,1fr) minmax(200px,300px) auto auto!important}.main-nav{min-width:0;overflow:hidden}.main-nav a{padding:9px 10px}}
@media(min-width:1120px) and (max-width:1279px){.main-nav a:nth-child(n+7){display:none}}
</style></head><body><div id="top"></div><div id="main"></div><div id="foot"></div><div class="toast" id="toast" role="status"></div>
<script>(()=>{
const CATS=[["news","News"],["sports","Sports"],["music","Music"],["culture","Culture"],["technology","Technology"],["business","Business"],["agriculture","Agriculture"],["health","Health"],["science","Science"]];
const REG=[["kenya","Kenya","KE"],["uganda","Uganda","UG"],["tanzania","Tanzania","TZ"],["rwanda","Rwanda","KE"],["ethiopia","Ethiopia","ET"],["nigeria","Nigeria","NG"],["ghana","Ghana","GH"],["south-africa","South Africa","ZA"],["egypt","Egypt","US"],["africa","Africa","US"],["world","World","US"],["usa","USA","US"],["uk","UK","GB"],["europe","Europe","US"],["asia","Asia","US"],["middle-east","Middle East","US"]];
const RTERM={kenya:"Kenya",uganda:"Uganda",tanzania:"Tanzania",rwanda:"Rwanda",ethiopia:"Ethiopia",nigeria:"Nigeria",ghana:"Ghana","south-africa":'"South Africa"',egypt:"Egypt",africa:"Africa",world:"",usa:'"United States" OR USA',uk:'UK OR Britain',europe:"Europe",asia:"Asia","middle-east":'"Middle East"',all:""};
const CTERM={all:"",news:"",sports:"sports OR football OR athletics OR rugby",music:"music OR musician OR album OR concert OR artist",culture:"entertainment OR film OR celebrity OR culture OR arts",technology:"technology OR AI OR startup OR gadgets",business:"business OR economy OR markets OR finance",agriculture:"agriculture OR farming OR farmers OR agribusiness",health:"health OR medicine OR hospital",science:"science OR research OR climate OR space"};
const BLOCKS=[["Kenya","Home turf","kenya","news"],["Africa","Across the continent","africa","news"],["World","Around the globe","world","news"],["Sports","Beyond the score","world","sports"],["Kenyan sports","Harambee Stars & more","kenya","sports"],["Music","Sounds & artists","all","music"],["Culture & entertainment","Screen, stage & people","all","culture"],["Technology","Ideas moving us forward","all","technology"],["Business","Markets & enterprise","all","business"],["Agriculture","Farming & food","africa","agriculture"],["Health","Wellbeing","world","health"],["Science","Discoveries & climate","world","science"],["Uganda","Country watch","uganda","news"],["Tanzania","Country watch","tanzania","news"],["Nigeria","Country watch","nigeria","news"],["South Africa","Country watch","south-africa","news"]];
const SOCIAL=[["Facebook","https://i.postimg.cc/DZHs0t4n/icons8-facebook-48.png","f"],["Instagram","https://i.postimg.cc/sD9QCBct/icons8-instagram-48.png","◎"],["X","https://i.postimg.cc/SNT49kNc/icons8-x-50.png","𝕏"],["TikTok","https://i.postimg.cc/3J667Rxx/icons8-tiktok-50.png","♪"],["YouTube","https://i.postimg.cc/W4V5bJLF/icons8-youtube-48.png","▶"],["Google News","https://i.postimg.cc/T2sQ5sMs/icons8-google-48.png","G"],["Telegram","https://i.postimg.cc/ZRMP3Wgx/icons8-telegram-48.png","➤"]];
const REFRESH_MS=60*1000;
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I={menu:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',sun:'<svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',moon:'<svg class="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg>',l:'<svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>',r:'<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>'};
const social=()=>SOCIAL.map(([n,u,f])=>`<a href="#" class="social-link" data-social="${n}" aria-label="${n}"><img src="${u}" alt="${n}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="social-fallback" hidden>${f}</span></a>`).join("");
const brand=`<a class="brand" href="#" data-home aria-label="Pulse360 home"><span class="brand-mark">P<span>360</span></span><span class="brand-copy"><strong>Pulse<span>360</span></strong><small>THE WORLD IN PERSPECTIVE</small></span></a>`;
const hue=s=>{let h=0;for(const c of String(s||"x"))h=(h*31+c.charCodeAt(0))%360;return h};
const ago=iso=>{if(!iso)return"";const s=(Date.now()-Date.parse(iso))/1e3;if(isNaN(s))return"";if(s<90)return"Just now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" hr ago";if(s<604800)return Math.round(s/86400)+" d ago";return new Date(iso).toLocaleDateString("en-KE",{day:"numeric",month:"short"})};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3000)};

// ---------- data (browser -> rss2json -> Google News / BBC) ----------
const cache=new Map(),store={};
const gn=(q,gl)=>`https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=en-${gl}&gl=${gl}&ceid=${gl}:en`;
const BBC={news:"news/world/rss.xml",sports:"sport/rss.xml",culture:"news/entertainment_and_arts/rss.xml",technology:"news/technology/rss.xml",business:"news/business/rss.xml",health:"news/health/rss.xml",science:"news/science_and_environment/rss.xml"};
async function j(url){const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url));const d=await r.json();if(d.status!=="ok")throw new Error(d.message||"feed error");return d.items||[]}
const hash=u=>{let h=5381;for(const c of u)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
function map(it,src){let title=(it.title||"").trim(),source=src||"";const m=title.match(/^(.*) - ([^-]{2,40})$/);if(!src&&m){title=m[1];source=m[2]}
 let img=it.thumbnail||(it.enclosure&&it.enclosure.link&&/image|jpe?g|png|webp/i.test((it.enclosure.type||"")+it.enclosure.link)?it.enclosure.link:"")||"";
 const desc=it.description||"";if(!img){const x=desc.match(/<img[^>]+src=["']([^"']+)/i);if(x)img=x[1]}
 img=img.replace(/^http:/,"https:");if(/bbci/.test(img))img=img.replace(/\/(240|320)\//,"/800/");
 const coverage=[];const re=/<li>\s*<a href="([^"]+)"[^>]*>([\s\S]*?)<\/a>[\s\S]*?<font[^>]*>([\s\S]*?)<\/font>/gi;let x;
 while((x=re.exec(desc))&&coverage.length<5){const t=x[2].replace(/<[^>]*>/g,"").trim();if(t&&!t.toLowerCase().startsWith(title.toLowerCase().slice(0,35)))coverage.push({title:t,url:x[1],source:x[3].replace(/<[^>]*>/g,"").trim()})}
 const ex=desc.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
 return{id:hash(it.link||title),title,url:it.link,source:source||"News",image:img||null,coverage,excerpt:ex&&!ex.toLowerCase().startsWith(title.toLowerCase().slice(0,30))&&!coverage.length?ex.slice(0,220):"",at:it.pubDate?it.pubDate.replace(" ","T")+"Z":null}}
async function feed(category,region,q="",days=7,skip=false){
 const key=[category,region,q,days].join("|"),hit=cache.get(key);if(hit&&!skip&&Date.now()-hit.t<REFRESH_MS-1000)return hit.v;
 const R=REG.find(r=>r[0]===region),gl=R?R[2]:"US",parts=[];
 if(q)parts.push(q);if(RTERM[region])parts.push("("+RTERM[region]+")");if(CTERM[category])parts.push("("+CTERM[category]+")");
 if(!parts.length)parts.push("world news");if(!q||days>7)parts.push("when:"+days+"d");
 const jobs=[j(gn(parts.join(" "),gl)).then(a=>a.map(i=>map(i)))];
 const bk=category==="all"?"news":category;
 if(!q&&days<=7&&(region==="world"||region==="all")&&BBC[bk])jobs.push(j("https://feeds.bbci.co.uk/"+BBC[bk]).then(a=>a.map(i=>map(i,"BBC News"))));
 if(!q&&days<=7&&region==="africa"&&category==="news")jobs.push(j("https://feeds.bbci.co.uk/news/world/africa/rss.xml").then(a=>a.map(i=>map(i,"BBC News"))));
 const res=await Promise.allSettled(jobs),seen=new Map();
 res.forEach(r=>r.status==="fulfilled"&&r.value.forEach(i=>{const k=i.title.toLowerCase().replace(/[^a-z0-9]+/g," ").slice(0,70);if(!seen.has(k))seen.set(k,i);else if(!seen.get(k).image&&i.image)seen.get(k).image=i.image}));
 const out=[...seen.values()].sort((a,b)=>Date.parse(b.at||0)-Date.parse(a.at||0));
 if(!out.length){if(hit)return hit.v;throw new Error("No stories returned — check your internet connection.")}
 cache.set(key,{t:Date.now(),v:out});try{localStorage.setItem("p360s:"+key,JSON.stringify(out.slice(0,100)))}catch{try{Object.keys(localStorage).filter(k=>k.startsWith("p360s:")).forEach(k=>localStorage.removeItem(k))}catch{}}
 return out}
// instant paint: saved copy first, fresh data right after
function swr(category,region,q,cb,skip){let had=false;if(!skip)try{const c=JSON.parse(localStorage.getItem("p360s:"+[category,region,q,7].join("|")));if(c&&c.length){cb(c);had=true}}catch{}
 return feed(category,region,q,7,skip).then(cb).catch(e=>{if(!had)throw e})}

// ---------- templates ----------
const media=i=>`<a class="card-media" data-story="${esc(i.id)}" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" tabindex="-1" style="--h:${hue(i.source)}" data-ini="${esc((i.source||"P")[0].toUpperCase())}">${i.image?`<img src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</a>`;
const card=i=>{store[i.id]=i;return `<article class="card">${media(i)}<div class="card-body"><div class="card-meta"><b>${esc(i.source)}</b><span>${ago(i.at)}</span></div><h3><a data-story="${esc(i.id)}" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a></h3>${i.excerpt?`<p>${esc(i.excerpt)}</p>`:""}</div></article>`};
const slide=i=>{store[i.id]=i;return `<article class="slide" style="--h:${hue(i.source)}">${i.image?`<img src="${esc(i.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<div class="slide-body"><span class="tag">${esc(i.tag||"Top story")}</span><h2><a data-story="${esc(i.id)}" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a></h2>${i.excerpt?`<p>${esc(i.excerpt)}</p>`:""}<div class="meta">${esc(i.source)} · ${ago(i.at)}</div></div></article>`};

// ---------- story preview (read more on Pulse360 before the source) ----------
let modal,lastFocus,tok=0;
const words=t=>t.replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(w=>w.length>2).slice(0,7).join(" ");
function openStory(id,push=true){const it=store[id];if(!it)return false;
 if(!modal){modal=document.createElement("div");modal.className="modal";modal.hidden=true;modal.innerHTML=`<div class="modal-bg" data-close></div><div class="modal-card" role="dialog" aria-modal="true" aria-label="Story preview" tabindex="-1"><button class="icon-btn modal-x" data-close aria-label="Close preview">${I.close}</button><div class="modal-scroll" id="m-body"></div></div>`;document.body.appendChild(modal);modal.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeStory()})}
 const my=++tok;if(modal.hidden)lastFocus=document.activeElement;
 $("#m-body").innerHTML=`<div class="m-media" style="--h:${hue(it.source)}" data-ini="${esc((it.source||"P")[0].toUpperCase())}">${it.image?`<img src="${esc(it.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div><div class="m-body"><div class="card-meta"><b>${esc(it.source)}</b><span>${ago(it.at)}</span></div><h2>${esc(it.title)}</h2>${it.excerpt?`<p class="m-sum">${esc(it.excerpt)}</p>`:""}<div class="m-actions"><a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">Read full story at ${esc(it.source)} ↗</a><button class="btn" id="m-share" type="button">Share</button></div>${it.coverage&&it.coverage.length?`<h3 class="m-h">Also reported by</h3><div class="m-list">${it.coverage.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title)}<small>${esc(c.source)} ↗</small></a>`).join("")}</div>`:""}<h3 class="m-h">More on this topic</h3><div class="m-list" id="m-more"><div class="skeleton" style="height:60px"></div></div></div>`;
 modal.hidden=false;document.body.classList.add("locked");$("#m-body").scrollTop=0;modal.querySelector(".modal-card").focus({preventScroll:true});
 history[push?"pushState":"replaceState"]({story:id},"");
 $("#m-share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:it.title,url:it.url});else{await navigator.clipboard.writeText(it.url);toast("Link copied")}}catch{}};
 feed("all","all",words(it.title)).then(a=>{if(my!==tok)return;const m=a.filter(x=>x.id!==it.id).slice(0,5);m.forEach(x=>store[x.id]=x);$("#m-more").innerHTML=m.length?m.map(x=>`<a href="${esc(x.url)}" data-story="${esc(x.id)}">${esc(x.title)}<small>${esc(x.source)} · ${ago(x.at)}</small></a>`).join(""):'<p class="m-credit">No related stories yet.</p>'}).catch(()=>{if(my===tok)$("#m-more").innerHTML='<p class="m-credit">Related stories unavailable right now.</p>'});
 return true}
function hideStory(){if(!modal||modal.hidden)return;tok++;modal.hidden=true;document.body.classList.remove("locked");lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true})}
function closeStory(){history.state&&history.state.story?history.back():hideStory()}
addEventListener("popstate",e=>{e.state&&e.state.story?openStory(e.state.story,false):hideStory()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal&&!modal.hidden)closeStory()});
document.addEventListener("click",e=>{const a=e.target.closest("[data-story]");if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey)return;if(openStory(a.dataset.story,!(modal&&!modal.hidden)))e.preventDefault()});

// ---------- shell ----------
$("#top").innerHTML=`<div class="top-strip"><div class="container strip-inner"><span class="live-badge">LIVE</span><span class="strip-date" id="clock"></span><div class="social-links">${social()}</div></div></div>
<header class="site-header"><div class="container header-main"><button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">${I.menu}</button>${brand}
<nav class="main-nav">${CATS.slice(0,6).map(c=>`<a href="#" data-go="${c[0]}">${c[1]}</a>`).join("")}</nav>
<div class="header-search"><form id="hs"><label class="sr-only" for="q">Search</label><input id="q" type="search" placeholder="Search news, sports, music…" autocomplete="off" enterkeyhint="search"><button aria-label="Search">${I.search}</button></form></div>
<button class="icon-btn theme-btn" id="theme" aria-label="Switch theme">${I.sun}${I.moon}</button></div></header>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-head">${brand}<button class="icon-btn" id="dclose" aria-label="Close menu">${I.close}</button></div>
<h3>TOPICS</h3>${CATS.map(c=>`<a class="d-link" href="#" data-go="${c[0]}"><b>${c[1]}</b></a>`).join("")}
<h3>COUNTRIES & REGIONS</h3><div class="chip-cloud">${REG.map(r=>`<a class="chip" href="#" data-reg="${r[0]}">${r[1]}</a>`).join("")}</div><h3>FOLLOW US</h3><div class="social-links">${social()}</div></aside>`;
$("#foot").innerHTML=`<footer class="site-footer"><div class="container footer-main"><div class="footer-brand">${brand}<p>Local perspective. Global pulse. Live news, sport, music and culture from Kenya, Africa and the world — updating automatically.</p><div class="social-links">${social()}</div></div>
<div class="footer-cols"><div class="footer-col"><h3>TOPICS</h3>${CATS.slice(0,6).map(c=>`<a href="#" data-go="${c[0]}">${c[1]}</a>`).join("")}</div><div class="footer-col"><h3>REGIONS</h3>${["kenya","uganda","tanzania","nigeria","africa","world"].map(k=>`<a href="#" data-reg="${k}">${REG.find(r=>r[0]===k)[1]}</a>`).join("")}</div></div></div>
<div class="container footer-note">Headlines come from Google News and BBC. Tap a story to read the full report on the publisher’s site.</div><div class="container footer-bottom"><span>© ${new Date().getFullYear()} Pulse360</span><a href="#" id="totop">Back to top ↑</a></div></footer>`;
const tick=()=>$("#clock").textContent=new Date().toLocaleString("en-KE",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});tick();setInterval(tick,30000);

// theme
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("p360-theme",t)}catch{}};
setTheme((()=>{try{return localStorage.getItem("p360-theme")}catch{}})()||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
// drawer
const d=$("#drawer"),sc=$("#scrim");
const closeD=()=>{d.classList.remove("open");sc.classList.remove("show");setTimeout(()=>sc.hidden=true,200);document.body.classList.remove("locked")};
$("#menu-btn").onclick=()=>{sc.hidden=false;requestAnimationFrame(()=>sc.classList.add("show"));d.classList.add("open");document.body.classList.add("locked")};
$("#dclose").onclick=closeD;sc.onclick=closeD;document.addEventListener("keydown",e=>e.key==="Escape"&&closeD());

// ---------- views ----------
const st={category:"all",region:"all",q:"",shown:24,view:"home",older:false,items:[],pending:[],busy:false};
let lastUpdate=null,heroSig="",paused=false;
function stamp(){lastUpdate=new Date();const s=$("#upd");if(s)s.textContent="Live · auto-updates every minute · last update "+lastUpdate.toLocaleTimeString("en-KE",{hour:"2-digit",minute:"2-digit"})}
function home(){
 st.view="home";heroSig="";scrollTo({top:0});
 $("#main").innerHTML=`<div class="ticker"><span class="ticker-label">LATEST</span><div class="ticker-view"><div class="ticker-track" id="tk"><a>Loading headlines…</a></div></div></div>
 <section class="container hero" id="hero"><div class="slide skeleton"></div></section>
 <div class="container status"><span id="upd">Loading…</span><button id="rf" type="button">↻ Refresh now</button></div>
 <section class="container section"><div class="sec-head"><div><span class="eyebrow">Explore by country & region</span><h2>Wherever it’s happening<i>.</i></h2></div></div><div class="chip-row">${REG.map(r=>`<a class="chip" href="#" data-reg="${r[0]}">${r[1]}</a>`).join("")}</div></section><div id="blocks"></div>`;
 $("#rf").onclick=()=>{$("#upd").textContent="Refreshing…";refreshHome(true)};
 const h=$("#hero");["pointerdown","mouseover"].forEach(e=>h.addEventListener(e,()=>paused=true));h.addEventListener("mouseleave",()=>paused=false);h.addEventListener("pointerup",()=>setTimeout(()=>paused=false,8000));
 loadTop(false);BLOCKS.forEach((b,i)=>$("#blocks").appendChild(block(b,i)));
}
const topList=items=>`<aside class="top-list"><h3><span class="pulse"></span>Top headlines · live</h3><ol>${[...items].sort((a,b)=>Date.parse(b.at||0)-Date.parse(a.at||0)).slice(0,6).map(i=>`<li><div><a data-story="${esc(i.id)}" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a><small>${esc(i.source)} · ${ago(i.at)}</small></div></li>`).join("")}</ol></aside>`;
function renderHero(out){
 const sig=out.map(x=>x.id).join();if(!out.length||sig===heroSig||!$("#hero"))return;heroSig=sig;
 $("#hero").innerHTML=`<div class="sec-head"><div><span class="eyebrow">Featured · updated every minute</span><h2>Top news<i>.</i></h2></div></div><div class="top-grid"><div class="hero-wrap"><div class="hero-track" id="ht">${out.map(slide).join("")}</div><button class="hero-nav prev" aria-label="Previous">${I.l}</button><button class="hero-nav next" aria-label="Next">${I.r}</button><div class="dots" id="dots">${out.map(()=>"<button></button>").join("")}</div></div>${topList(out)}</div>`;
 const t=$("#ht"),dots=[...$("#dots").children],w=()=>t.children[0].getBoundingClientRect().width+12,cur=()=>Math.round(t.scrollLeft/w());
 const go=n=>t.scrollTo({left:((n+out.length)%out.length)*w(),behavior:"smooth"});
 t.onscroll=()=>requestAnimationFrame(()=>dots.forEach((x,k)=>x.classList.toggle("on",k===cur())));dots[0].classList.add("on");dots.forEach((x,k)=>x.onclick=()=>go(k));
 $(".prev").onclick=()=>go(cur()-1);$(".next").onclick=()=>go(cur()+1)}
function loadTop(skip){
 const plan=[["kenya","news","Kenya"],["world","news","World"],["africa","news","Africa"],["world","sports","Sports"],["world","culture","Culture"],["kenya","sports","Kenyan sport"],["world","technology","Tech"]];
 const lists=plan.map(()=>[]);let fails=0,done=0;
 const build=()=>{const out=[],seen=new Set();for(let r=0;r<6&&out.length<8;r++)lists.forEach(l=>{const x=l[r];if(x&&!seen.has(x.title)&&out.length<8){seen.add(x.title);out.push(x)}});
  if(!out.length)return;renderHero(out);
  const tk=[];lists.slice(0,2).forEach((l,n)=>l.slice(0,6).forEach(x=>tk.push(`<a href="${esc(x.url)}" data-story="${esc(x.id)}"><b>${n?"WORLD":"KENYA"}</b>${esc(x.title)}</a>`)));const th=tk.join("");if(th&&$("#tk"))$("#tk").innerHTML=th+th;stamp()};
 plan.forEach((p,i)=>swr(p[1],p[0],"",a=>{lists[i]=a.slice(0,8).map(x=>({...x,tag:p[2]})).sort((x,y)=>!!y.image-!!x.image);build()},skip)
  .catch(()=>{fails++}).finally(()=>{done++;if(done===plan.length&&fails===plan.length&&!heroSig&&$("#hero")){$("#hero").innerHTML='<div class="error">Couldn’t load stories. Check your internet connection, then press Refresh.</div>';$("#upd").textContent="Offline?"}}));
}
function block([title,eyebrow,region,category],i){
 const el=document.createElement("section");el.className="section"+(i%2?" alt":"");let sig="";
 el.innerHTML=`<div class="container"><div class="sec-head"><div><span class="eyebrow">${esc(eyebrow)}</span><h2>${esc(title)}<i>.</i></h2></div><a class="see-all" href="#" data-go="${category}" data-reg="${region}">See all →</a></div><div class="rail-wrap"><button class="rail-btn l" aria-label="Left">${I.l}</button><div class="rail"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><button class="rail-btn r" aria-label="Right">${I.r}</button></div></div>`;
 const rail=$(".rail",el);$(".l",el).onclick=()=>rail.scrollBy({left:-rail.clientWidth*.85,behavior:"smooth"});$(".r",el).onclick=()=>rail.scrollBy({left:rail.clientWidth*.85,behavior:"smooth"});
 const paint=a=>{a=a.slice(0,14);const s=a.map(x=>x.id).join();if(s===sig||(sig&&rail.scrollLeft>40))return;sig=s;rail.innerHTML=a.map(card).join("")+`<a class="card" href="#" data-go="${category}" data-reg="${region}" style="flex:0 0 190px;display:grid;place-items:center;font-weight:800;color:var(--red);text-align:center;padding:12px">Load more ${esc(title)} →</a>`};
 el._load=skip=>swr(category,region,"",paint,skip).catch(e=>{if(!sig)rail.innerHTML=`<div class="error">${esc(e.message)}</div>`});
 new IntersectionObserver((en,ob)=>{if(en[0].isIntersecting){ob.disconnect();el._on=true;el._load()}},{rootMargin:"800px"}).observe(el);return el}
function refreshHome(skip){cache.clear();loadTop(true);document.querySelectorAll("#blocks .section").forEach(s=>s._on&&s._load(true))}
const key=i=>i.title.toLowerCase().replace(/[^a-z0-9]+/g," ").slice(0,70);
function explore(){
 st.view="explore";st.older=false;st.pending=[];st.items=[];scrollTo({top:0});
 const rl=r=>r==="all"?"Everywhere":REG.find(x=>x[0]===r)[1],cl=c=>c==="all"?"Latest":CATS.find(x=>x[0]===c)[1];
 $("#main").innerHTML=`<main class="container page"><header class="page-head"><span class="eyebrow">${st.q?"SEARCH":"LIVE FEED"}</span><h1>${esc(st.q?"Results for “"+st.q+"”":cl(st.category)+(st.region==="all"?"":" · "+rl(st.region)))}</h1></header>
 <div class="chip-row">${[["all","All"],...CATS].map(c=>`<button class="chip ${st.category===c[0]?"active":""}" data-c="${c[0]}">${c[1]}</button>`).join("")}</div>
 <div class="chip-row">${[["all","Everywhere"],...REG].map(r=>`<button class="chip ${st.region===r[0]?"active":""}" data-r="${r[0]}">${r[1]}</button>`).join("")}</div>
 <div class="status"><span id="upd">Fetching…</span><button id="rf" type="button">↻ Refresh</button></div><button class="newbar" id="newbar" hidden></button><div class="grid" id="g">${'<div class="skeleton"></div>'.repeat(6)}</div><div class="center"><button class="btn" id="more" hidden>Load more stories ↓</button><p class="caught" id="end" hidden>You’re all caught up ✓ — new stories appear automatically.</p></div></main>`;
 $("#rf").onclick=()=>explore();st.shown=24;
 $("#more").onclick=more;$("#newbar").onclick=()=>{st.items=st.pending.concat(st.items);st.pending=[];$("#newbar").hidden=true;draw();scrollTo({top:0,behavior:"smooth"})};
 new IntersectionObserver(en=>{if(en[0].isIntersecting&&!$("#more").hidden)more()},{rootMargin:"500px"}).observe($("#more"));
 let painted=false;swr(st.category,st.region,st.q,a=>{st.items=a;draw();painted=true;stamp()}).catch(e=>{if(!painted){$("#g").innerHTML=`<div class="error" style="grid-column:1/-1">${esc(e.message)}</div>`;$("#upd").textContent="Couldn’t refresh"}})}
function draw(){const g=$("#g");if(!g)return;const l=st.items.slice(0,st.shown);g.innerHTML=l.length?l.map(card).join(""):'<div class="empty" style="grid-column:1/-1">No stories found.</div>';const done=st.shown>=st.items.length&&st.older;$("#more").hidden=done||!l.length;$("#more").textContent="Load more stories ↓";$("#end").hidden=!(done&&l.length)}
async function more(){if(st.busy)return;st.busy=true;const b=$("#more");try{if(st.shown<st.items.length){st.shown+=24;draw();return}
 if(!st.older){st.older=true;b.textContent="Loading older stories…";const a=await feed(st.category,st.region,st.q,30),seen=new Set(st.items.map(key));st.items=st.items.concat(a.filter(i=>!seen.has(key(i))));st.shown+=24}draw()}catch{b.textContent="Couldn’t load — tap to retry";st.older=false}finally{st.busy=false}}
async function poll(){if(document.hidden||st.busy||st.view!=="explore")return;try{const a=await feed(st.category,st.region,st.q,7,true),have=new Set(st.items.map(key)),fresh=a.filter(i=>!have.has(key(i)));stamp();if(fresh.length){st.pending=fresh;const b=$("#newbar");b.textContent="↑ "+fresh.length+" new "+(fresh.length>1?"stories":"story")+" — tap to show";b.hidden=false}}catch{}}
// ---------- events ----------
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-social],[data-go],[data-reg],[data-home],#totop,[data-c],[data-r]");if(!a||a.closest("[data-story]")&&a.dataset.story)return;
 if(a.dataset.social){e.preventDefault();return toast("Pulse360’s "+a.dataset.social+" page will be linked here once it is live.")}
 if(a.id==="totop"){e.preventDefault();return scrollTo({top:0,behavior:"smooth"})}
 if(a.dataset.c!==undefined&&a.tagName==="BUTTON"){st.category=a.dataset.c;return explore()}
 if(a.dataset.r!==undefined&&a.tagName==="BUTTON"){st.region=a.dataset.r;return explore()}
 e.preventDefault();closeD();
 if("home"in a.dataset){st.q="";return home()}
 st.q="";st.category=a.dataset.go||"all";st.region=a.dataset.reg||(a.dataset.go?"all":st.region);if(a.dataset.reg&&!a.dataset.go)st.category="all";explore()});
$("#hs").onsubmit=e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;st.q=q;st.category="all";st.region="all";explore()};
// ---------- AUTO UPDATE every minute ----------
setInterval(()=>{if(document.hidden)return;st.view==="home"?refreshHome(true):poll()},REFRESH_MS);
setInterval(()=>{const t=$("#ht");if(!t||paused||document.hidden||matchMedia("(prefers-reduced-motion:reduce)").matches)return;const w=t.children[0].getBoundingClientRect().width+12;t.scrollTo({left:((Math.round(t.scrollLeft/w)+1)%t.children.length)*w,behavior:"smooth"})},6500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&lastUpdate&&Date.now()-lastUpdate>REFRESH_MS)st.view==="home"?refreshHome(true):poll()});
home();
})();
</script></body></html>
